<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Admin Demen FM</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#071b36;color:white;font-family:Arial,sans-serif}
header{background:#087eaa;text-align:center;padding:20px}
h1{color:#ffd84d;margin:0}
main{max-width:800px;margin:auto;padding:12px}
details{background:#102a4a;border:1px solid #36516e;border-radius:12px;margin:12px 0;overflow:hidden}
summary{padding:15px;background:#0b203b;font-size:17px;font-weight:bold;cursor:pointer}
.content{padding:14px}
label{display:block;margin:12px 0 6px;font-weight:bold}
input,select,textarea{width:100%;padding:11px;border-radius:7px;margin-bottom:8px}
button{background:#087eaa;color:white;border:0;border-radius:8px;padding:12px;margin:4px 2px;font-weight:bold}
.red{background:#df354f}
.yellow{background:#ffd84d;color:#102033}
.status{background:#061426;padding:12px;border-radius:8px;margin-top:10px;overflow-wrap:anywhere}
audio,iframe{width:100%;margin-top:10px}
iframe{aspect-ratio:16/9;border:0}
img{max-width:100%}
small{color:#c4d3e4}
</style>
</head>
<body>
<header>
<h1>DEMEN FM 88</h1>
<p>Studio Admin — Emang Ndemenin</p>
<p>Radionya Cilacap</p>
</header>
<main>

<details open>
<summary>Pengaturan Siaran</summary>
<div class="content">
<label>Protokol</label>
<select id="protocol">
<option>SHOUTcast 1</option>
<option>SHOUTcast 2</option>
<option>Icecast</option>
</select>

<label>Host / IP server</label>
<input id="host" placeholder="Host server radio">

<label>Port</label>
<input id="port" type="number" placeholder="Port server">

<label>Bitrate</label>
<select id="bitrate">
<option>64 kbps</option>
<option selected>96 kbps</option>
<option>128 kbps</option>
</select>

<label>Sample rate</label>
<select id="sampleRate">
<option selected>44100 Hz</option>
<option>48000 Hz</option>
</select>

<label>Saluran audio</label>
<select id="channels">
<option>Stereo</option>
<option>Mono</option>
</select>

<button onclick="simpanPengaturan()">Simpan Pengaturan</button>
<div class="status" id="statusPengaturan">Pengaturan belum disimpan.</div>
</div>
</details>

<details open>
<summary>Pemutar Musik dari HP</summary>
<div class="content">
<label>Pilih file lagu</label>
<input id="musicFiles" type="file" accept="audio/*" multiple>
<audio id="audioPlayer" controls></audio>
<button onclick="putar()">Putar</button>
<button onclick="laguSebelum()">Sebelumnya</button>
<button onclick="laguBerikut()">Berikutnya</button>
<button class="red" onclick="berhenti()">Berhenti</button>
<div class="status" id="nowPlaying">Belum ada lagu dipilih.</div>
<ol id="songList"></ol>
<small>Musik lokal ini belum otomatis terkirim ke pendengar radio.</small>
</div>
</details>
